monitor=,preferred,auto,1,vrr,0
#monitor=,2560x1600@90,auto,1.25

# --- UWSM Service Autostarts ---
exec-once = uwsm app -s b -- hypridle
exec-once = uwsm app -s b -- wl-paste --watch cliphist store
exec-once = uwsm app -s b -- waybar -c ~/system/configs/waybar/config
exec-once = uwsm app -s b -- quickshell -d -p ~/system/configs/quickshell/shell.qml
exec-once = uwsm app -s b -- nm-applet
exec-once = uwsm app -s b -- dunst
exec-once = uwsm app -s b -- fcitx5 -d
exec-once = uwsm app -s b -- swaybg -i ~/system/wallpapers/newyorkblackwhite.jpg

# Terminal workspace autostart (isolated apps)
exec-once = uwsm app -s b -- foot btop
exec-once = uwsm app -s b -- foot bluetuith
exec-once = uwsm app -s b -- foot pulsemixer
exec-once = uwsm app -s b -- foot nvtop

xwayland {
  force_zero_scaling = true
}

windowrule {
    name = pinned-blue
    match:pin = 1
    border_color = rgb(0000AA) rgb(000044)
}

windowrule {
    name = vlc-idle-always
    match:class = ^(vlc)$
    idle_inhibit = focus
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    repeat_rate = 50
    repeat_delay = 200
    follow_mouse = 1
    mouse_refocus = false
    force_no_accel= true

    touchpad {
        natural_scroll = yes
        disable_while_typing = false
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(AAAAAAFF)
    col.inactive_border = rgba(444444FF)

    layout = master
}

decoration {
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    animation=workspaces,0
    animation=windows,1,2,default
    enabled = true
}

dwindle {
}

master {
    mfact=0.50
}

misc {
    disable_hyprland_logo = true
    enable_anr_dialog = false
    render_unfocused_fps = 5
}

debug {
    vfr = true
}

$mainMod = SUPER

# --- Media & Hardware Control (Direct execs, no cgroup isolation needed) ---
bind = $mainMod, c, exec, bash /home/cozy/system/scripts/chiphist-fuzzel-img.sh
binde = ,XF86AudioRaiseVolume, exec, pamixer -i 5
binde = ,XF86AudioLowerVolume, exec, pamixer -d 5
binde = ,XF86AudioMute, exec, pamixer -t
binde = ,XF86AudioMicMute, exec, pamixer --default-source -t
bind = ,XF86Launch1, exec, asusctl anime -b High
bind = ,XF86Launch4, exec, asusctl anime -b Off
binde = ,XF86MonBrightnessUp, exec, brightnessctl s +1%
binde = ,XF86MonBrightnessDown, exec, brightnessctl s 1%-
bind = ,XF86KbdBrightnessDown, exec, asusctl leds prev
bind = ,XF86KbdBrightnessUp, exec, asusctl leds next
bind = ,XF86Launch3, exec, asusctl aura effect --next-mode
bind = $mainMod, s, exec, grimblast --freeze copysave area /home/cozy/shots/$(date +smol-%F-%H-%M-%S-%N.png) && notify-send "Smol Screenshot Taken"
bind = $mainMod, w, exec, grimblast copysave screen /home/cozy/shots/$(date +wide-%F-%H-%M-%S-%N.png) && notify-send "Wide Screenshot Taken"

# --- GUI Application Launchers (Isolated via UWSM Scopes) ---
bind = $mainMod, r, exec, fuzzel
bind = $mainMod, e, exec, bemoji -n && notify-send "Emoji saved to Clipboard"
bind = $mainMod, d, exec, uwsm app -s a -- pcmanfm
bind = $mainModSHIFT, b, exec, uwsm app -s a -- firefox
bind = $mainMod, b, exec, uwsm app -s a -- google-chrome-stable
bind = $mainMod, t, exec, foot

# --- Window & Layout Actions ---
bind = $mainMod, space, togglefloating,
bind = $mainMod, f, fullscreen,
bind = $mainModSHIFT, q, forcekillactive,

# --- Session Teardown via UWSM ---
bind = $mainModSHIFT, BackSpace, exec, uwsm stop
bind = $mainMod, return, layoutmsg, swapwithmaster
bind = $mainMod, k, layoutmsg, cycleprev
bind = $mainMod, j, layoutmsg, cyclenext
bind = $mainModSHIFT, k, layoutmsg, swapprev
bind = $mainModSHIFT, j, layoutmsg, swapnext
bind = $mainModSHIFT, Tab, layoutmsg, orientationprev
bind = $mainMod, Tab, cyclenext
bind = $mainMod, Tab, bringactivetotop 
#bind = $mainModSHIFT, p, swapnext, prev
#bind = $mainModSHIFT, n, swapnext
bind = $mainModSHIFT, p, pin, active

bind = $mainMod, h, layoutmsg, mfact -0.05
bind = $mainMod, l, layoutmsg, mfact +0.05
binde = $mainModSHIFT, h, moveactive, -10 0
binde = $mainModSHIFT, j, moveactive, 0 10
binde = $mainModSHIFT, k, moveactive, 0 -10
binde = $mainModSHIFT, l, moveactive, 10 0
binde = $mainModALT, h, resizeactive, -10 0
binde = $mainModALT, j, resizeactive, 0 10
binde = $mainModALT, k, resizeactive, 0 -10
binde = $mainModALT, l, resizeactive, 10 0 

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10


# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainModSHIFT, 1, movetoworkspace, 1
bind = $mainModSHIFT, 2, movetoworkspace, 2
bind = $mainModSHIFT, 3, movetoworkspace, 3
bind = $mainModSHIFT, 4, movetoworkspace, 4
bind = $mainModSHIFT, 5, movetoworkspace, 5
bind = $mainModSHIFT, 6, movetoworkspace, 6
bind = $mainModSHIFT, 7, movetoworkspace, 7
bind = $mainModSHIFT, 8, movetoworkspace, 8
bind = $mainModSHIFT, 9, movetoworkspace, 9
bind = $mainModSHIFT, 0, movetoworkspace, 10


# Scroll through existing workspaces with mainMod + scroll
#bind = $mainMod, mouse_down, monitor, m+1
#bind = $mainMod, mouse_up, 


# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

